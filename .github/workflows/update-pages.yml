name: Update GitHub Pages

on:
  workflow_call:
    inputs:
      release_tag:
        description: 'Release tag that triggered this update'
        required: false
        type: string
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'
  release:
    types: [published, edited]

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install requests jinja2
      - name: Restore download stats
        uses: actions/cache@v5
        with:
          path: docs/download_stats.json
          key: download-stats-${{ github.run_id }}
          restore-keys: |
            download-stats-
      - name: Generate index pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/generate_pages.py \
            --owner ${{ github.repository_owner }} \
            --repo ${{ github.event.repository.name }} \
            --token $GITHUB_TOKEN \
            --output docs
      - name: Setup Pages
        uses: actions/configure-pages@v6
      # NOTE: no pre-deploy deletion of `github-pages` artifacts here. Deploy-pages
      # resolves the artifact via the run's artifact listing, which is eventually
      # consistent: deleting same-name artifacts seconds before deploy makes the
      # lookup return a stale (already-deleted) id -> "Unable to find artifact
      # matching the id" (400). Old artifacts expire on their own (retention 1 day).
      # The artifact name is per-attempt so re-running failed deploy jobs never
      # collides with a previous attempt's artifact of the same name.
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'docs'
          name: github-pages-${{ github.run_attempt }}
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

